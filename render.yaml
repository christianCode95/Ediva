services:
  - type: web
    name: ediva
    runtime: node
    plan: 0.5c-512mb
    region: ohio
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: ediva-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: VITE_PUBLIC_SITE_URL
        value: https://christiancode95.github.io/Ediva/
      - key: EDIVA_DB_PATH
        value: /var/data/ediva.sqlite
      - key: EDIVA_COURSE_ANSWER_KEYS_PATH
        value: /var/data/course-answer-keys.json
      - key: EDIVA_COURSE_ANSWER_KEYS_JSON
        sync: false
      - key: EDIVA_TRUST_CLOUDFLARE
        value: "true"
