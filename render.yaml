services:
  - type: web
    name: ediva
    runtime: node
    plan: 0.5c-512mb
    region: ohio
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    domains:
      - ediva.com.br
    disk:
      name: ediva-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: EDIVA_ALLOWED_ORIGINS
        value: https://ediva.com.br,https://www.ediva.com.br
      - key: EDIVA_DB_PATH
        value: /var/data/ediva.sqlite
      - key: EDIVA_TRUST_CLOUDFLARE
        value: "true"
